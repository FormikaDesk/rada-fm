# Policy for `cargo deny check` (run in CI by the "audit" job).

[graph]
# The systems rada is released for: platform-specific crates are checked too.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# A known vulnerability, an unmaintained or a yanked crate fails the check. An advisory that
# does not apply is listed in `ignore` with the reason, never silenced otherwise.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Permissive licences only. Anything else (a copyleft one, or none) fails until it is looked at.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # libbz2-rs-sys: the bzip2 licence, BSD-like.
    "bzip2-1.0.6",
    # webpki-roots: the certificate data of the Mozilla list.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate usually come from a dependency of ours; they are shown, not refused.
multiple-versions = "warn"
# `*` as a version is refused, except for the crates of this workspace (by path).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io: no git dependency, no other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
