name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build everything and run the core tests on all three systems.
  # Tests that are not supported yet on Windows/macOS are marked #[ignore = "<reason>"]
  # in the source, so the reason shows up in the test output.
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows and macOS: platform support is in progress, so a failure there is reported
    # but does not fail the workflow. Linux is required.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test core
        run: cargo test -p rada-core

  # Formatting, lints and the rest of the workspace (Linux).
  quality:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The declared minimum Rust version must keep building.
  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
