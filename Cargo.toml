[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/rada"]
# The fuzz targets have a workspace of their own (cargo-fuzz, rust nightly).
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0-rc.17"
edition = "2024"
license = "MIT"
authors = ["Alessandro Formica"]
rust-version = "1.90"
repository = "https://github.com/formikadesk/rada-fm"
homepage = "https://github.com/formikadesk/rada-fm"

# The crates of the workspace, by path and by version: crates.io wants both. The version is
# exact because the three crates are released together and only fit each other;
# scripts/set-version.sh moves it with the workspace version.
[workspace.dependencies]
rada-core = { path = "crates/core", version = "=0.6.0-rc.17" }
rada-tui = { path = "crates/tui", version = "=0.6.0-rc.17" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
