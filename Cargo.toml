[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/rada"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alessandro Formica"]
rust-version = "1.86"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
