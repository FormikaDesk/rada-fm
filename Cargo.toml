[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/rada"]

[workspace.package]
version = "0.6.0-rc.11"
edition = "2024"
license = "MIT"
authors = ["Alessandro Formica"]
rust-version = "1.90"
repository = "https://github.com/formikadesk/rada-fm"
homepage = "https://github.com/formikadesk/rada-fm"
readme = "README.md"
# Released as binaries and built from source; never published to crates.io (the workspace
# crates depend on each other by path alone).
publish = false
keywords = ["file-manager", "tui", "terminal", "undo", "rust"]
categories = ["command-line-utilities", "filesystem"]

# The crates of the workspace, by path: the version follows [workspace.package] and is not
# written twice.
[workspace.dependencies]
rada-core = { path = "crates/core" }
rada-tui = { path = "crates/tui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
