[package]
name = "rada-core"
description = "Filesystem model, plan/execute/undo engine, journal and platform layer for rada"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Test helpers (isolated XDG sandbox + real-path tripwire). Enabled by dev-dependency on itself.
testutil = ["dep:tempfile"]

[dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
notify = "8"
unicode-width = "0.2"
encoding_rs = "0.8"
chardetng = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tempfile = { version = "3", optional = true }
jiff = "0.2.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
schemars = "1.2.2"
# Archives: pure Rust, except zstd, which uses the official library (bundled C source, no system library needed).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "deflate64"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "encoder", "xz"] }
zstd = { version = "0.14", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
# Updates: HTTPS with rustls (certificates bundled, nothing read from the system) and SHA-256.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# Page count, title and author of a PDF when poppler is not there to say.
lopdf = { version = "0.45", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The names and the kinds of things the Finder shows (localized folder names, packages).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError", "NSArray", "NSDictionary", "NSObject", "NSValue", "NSEnumerator"] }

[target.'cfg(windows)'.dependencies]
# Drive letters, Known Folders and ShellExecute: the Win32 calls, with no wrapper around them.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The Recycle Bin: moving to it and putting back (the shell's own COM interfaces).
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
# Windows' own PDF renderer (Windows.Data.Pdf) and the shell's thumbnails.
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
rada-core = { path = ".", features = ["testutil"] }
proptest = "1.11.0"
