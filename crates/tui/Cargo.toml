[package]
name = "rada-tui"
description = "Terminal user interface for rada (ratatui + crossterm)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rada-core = { path = "../core", version = "0.1.0" }
ratatui = "0.30"
crossterm = "0.29"
crossbeam-channel = "0.5"
tracing = "0.1"
unicode-width = "0.2"
jiff = "0.2.38"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false }

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.151"
rada-core = { path = "../core", features = ["testutil"] }

[target."cfg(unix)".dependencies]
signal-hook = "0.4.5"
libc = "0.2"
