[package]
name = "rada-tui"
description = "The terminal interface of rada, a terminal file manager, built on ratatui and crossterm (no stable API)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tui", "terminal", "file-manager", "ratatui", "crossterm"]
categories = ["command-line-interface", "filesystem"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lints]
workspace = true

[dependencies]
rada-core = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
crossbeam-channel = "0.5"
tracing = "0.1"
unicode-width = "0.2"
jiff = "0.2.38"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false }

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.151"
rada-core = { workspace = true, features = ["testutil"] }

[target."cfg(unix)".dependencies]
signal-hook = "0.4.5"
libc = "0.2"

[target."cfg(windows)".dependencies]
# Asking the terminal (background colour, cell size) through the console's own input,
# and finding out which terminal the console is shown in.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
