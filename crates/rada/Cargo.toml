[package]
name = "rada"
description = "A safe harbor for your files: a terminal file manager with plan-first operations, permanent undo and robust copying"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
rada-core = { path = "../core", version = "0.6.0-rc.1" }
rada-tui = { path = "../tui", version = "0.6.0-rc.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
# Shortcuts (.lnk): the shell's own COM interfaces.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.27.0"
rada-core = { path = "../core", version = "0.6.0-rc.1", features = ["testutil"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
